<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑假練習本</title>
<style>
  :root{
    --paper:#FCFAF4;
    --card:#FFFFFF;
    --ink:#2E3148;
    --ink-soft:#74789A;
    --grape:#5A55D6;
    --grape-deep:#3F3AB8;
    --grape-tint:#EEEDFB;
    --mango:#FF9A52;
    --sun:#FFC53D;
    --leaf:#2FBF71;
    --leaf-tint:#E4F7EE;
    --coral:#F26D6D;
    --coral-tint:#FDEAEA;
    --grid:rgba(90,85,214,0.09);
    --line:rgba(46,49,72,0.10);
    --shadow:0 12px 34px rgba(46,49,72,0.10);
    --shadow-sm:0 4px 14px rgba(46,49,72,0.08);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(255,154,82,0.10), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(90,85,214,0.08), transparent 55%),
      var(--paper);
    min-height:100%;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:20px 18px 60px}

  /* ---------- Header ---------- */
  header.app{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:6px 2px 20px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{
    width:46px;height:46px;border-radius:14px;flex:none;
    background:linear-gradient(150deg,var(--grape),var(--grape-deep));
    display:grid;place-items:center;box-shadow:var(--shadow-sm);position:relative;
  }
  .brand .logo svg{width:26px;height:26px}
  .brand h1{font-size:1.42rem;font-weight:700;letter-spacing:.5px;line-height:1.1}
  .brand p{font-size:.82rem;color:var(--ink-soft);font-weight:500;margin-top:1px}
  .tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:14px;box-shadow:var(--shadow-sm)}
  .tab{
    border:none;background:none;font-family:inherit;font-weight:600;font-size:.92rem;
    color:var(--ink-soft);padding:7px 16px;border-radius:10px;cursor:pointer;transition:.15s;
  }
  .tab.on{background:var(--grape);color:#fff;box-shadow:0 4px 10px rgba(90,85,214,.3)}

  /* ---------- Setup ---------- */
  .greet{margin:6px 2px 18px}
  .greet h2{font-size:1.34rem;font-weight:700}
  .greet h2 .wave{display:inline-block;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(16deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
  .greet p{color:var(--ink-soft);font-weight:500;font-size:.95rem;margin-top:2px}

  .section-label{font-size:.82rem;font-weight:700;color:var(--ink-soft);letter-spacing:1.5px;margin:22px 2px 12px;text-transform:uppercase}

  .topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:620px){.topic-grid{grid-template-columns:repeat(4,1fr)}}
  .topic{
    position:relative;background:var(--card);border:2px solid transparent;border-radius:var(--radius);
    padding:16px 14px 14px;cursor:pointer;transition:transform .14s, box-shadow .14s, border-color .14s;
    box-shadow:var(--shadow-sm);text-align:left;font-family:inherit;
  }
  .topic:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .topic .ico{font-size:1.7rem;line-height:1;display:block;margin-bottom:10px}
  .topic .nm{font-weight:700;font-size:1rem;display:block}
  .topic .ds{font-size:.76rem;color:var(--ink-soft);font-weight:500;margin-top:2px}
  .topic .check{
    position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
    background:var(--grape);display:grid;place-items:center;opacity:0;transform:scale(.5);transition:.18s;
  }
  .topic .check svg{width:13px;height:13px}
  .topic.sel{border-color:var(--grape);background:var(--grape-tint)}
  .topic.sel .check{opacity:1;transform:scale(1)}

  .controls{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
  .ctrl-block{flex:1;min-width:220px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:2px solid var(--line);background:#fff;font-family:inherit;font-weight:600;font-size:.92rem;
    color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:var(--grape)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .cta-row{margin-top:30px}
  .btn{
    font-family:inherit;font-weight:700;font-size:1.05rem;border:none;border-radius:16px;cursor:pointer;
    padding:15px 26px;transition:transform .12s, box-shadow .12s, background .15s;
  }
  .btn:active{transform:translateY(2px)}
  .btn-primary{background:linear-gradient(150deg,var(--grape),var(--grape-deep));color:#fff;box-shadow:0 10px 22px rgba(90,85,214,.34);width:100%}
  .btn-primary:hover{box-shadow:0 14px 28px rgba(90,85,214,.42)}
  .btn-ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
  .btn-ghost:hover{box-shadow:var(--shadow)}
  .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

  /* ---------- Practice ---------- */
  .pbar-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
  .pbar-top .meta{font-weight:600}
  .pbar-top .meta b{color:var(--grape)}
  .pbar-top .topicname{font-size:.86rem;color:var(--ink-soft);font-weight:600}
  .progress{height:12px;background:#fff;border-radius:99px;box-shadow:inset 0 1px 3px rgba(46,49,72,.08);overflow:hidden;margin-bottom:24px}
  .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sun),var(--mango));transition:width .35s ease}

  .qcard{
    background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:34px 26px 30px;position:relative;overflow:hidden;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;background-position:-1px -1px;
  }
  .qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--coral),var(--mango))}
  .qtag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:1px;color:var(--grape);background:var(--grape-tint);padding:4px 12px;border-radius:99px;margin-bottom:18px}
  .qtext{font-size:1.4rem;font-weight:500;line-height:1.5;color:var(--ink)}
  .qtext .num{font-family:-apple-system,'PingFang TC',system-ui,sans-serif;font-weight:600}
  .visual{margin:20px 0 4px;display:flex;justify-content:center}

  /* fraction */
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-family:-apple-system,'PingFang TC',system-ui,sans-serif;font-weight:600}
  .frac .n{padding:0 6px}
  .frac .d{padding:0 6px;border-top:2.5px solid var(--ink)}

  .answer-area{margin-top:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .answer-area .lab{font-weight:700;font-size:1.05rem}
  .field{
    font-family:-apple-system,'PingFang TC',system-ui,sans-serif,'Noto Sans TC',sans-serif;font-weight:600;font-size:1.4rem;text-align:center;
    border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;width:150px;background:#fff;color:var(--ink);
    transition:border-color .15s, box-shadow .15s;outline:none;
  }
  .field:focus{border-color:var(--grape);box-shadow:0 0 0 4px var(--grape-tint)}
  .field.small{width:84px}
  .unit{font-weight:600;font-size:1.05rem;color:var(--ink-soft)}
  .hint{font-size:.82rem;color:var(--ink-soft);font-weight:500;margin-top:10px}
  .timegroup{display:inline-flex;align-items:center;gap:8px}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opts .chip{font-size:1.15rem;padding:10px 20px;min-width:72px}
  .opts .chip .frac .d{border-top-color:currentColor}

  .nav-row{display:flex;gap:12px;margin-top:26px}
  .nav-row .btn{flex:1}

  /* ---------- Result ---------- */
  .result-head{text-align:center;padding:14px 0 8px}
  .star-wrap{position:relative;width:120px;height:120px;margin:0 auto 6px}
  .star-wrap svg{width:100%;height:100%;filter:drop-shadow(0 8px 16px rgba(255,197,61,.5))}
  .score-big{font-family:-apple-system,'PingFang TC',system-ui,sans-serif;font-weight:700;font-size:2.6rem;line-height:1.1}
  .score-big b{color:var(--grape)}
  .score-msg{font-weight:700;font-size:1.2rem;margin-top:4px}
  .score-sub{color:var(--ink-soft);font-weight:500;margin-top:2px}

  .dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px auto 4px;max-width:520px}
  .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.9rem;color:#fff;font-weight:700}
  .dot.ok{background:var(--leaf)}
  .dot.no{background:var(--coral)}

  .review{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  .ritem{
    background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);padding:16px 18px;
    display:flex;gap:14px;align-items:flex-start;border-left:5px solid var(--leaf);
  }
  .ritem.wrong{border-left-color:var(--coral)}
  .ritem .mark{font-family:-apple-system,'PingFang TC',system-ui,sans-serif;font-weight:700;font-size:1.5rem;flex:none;width:30px;text-align:center;transform:rotate(-8deg)}
  .ritem.ok .mark{color:var(--leaf)}
  .ritem.wrong .mark{color:var(--coral)}
  .ritem .body{flex:1;min-width:0}
  .ritem .qn{font-size:.74rem;font-weight:700;color:var(--ink-soft);letter-spacing:.5px}
  .ritem .q{font-size:1.02rem;font-weight:500;margin:2px 0 6px;line-height:1.45}
  .ritem .ans{font-size:.92rem;font-weight:600}
  .ritem .ans .you{color:var(--ink-soft)}
  .ritem .ans .you s{color:var(--coral)}
  .ritem .ans .right{color:var(--leaf);margin-left:10px}

  .result-cta{display:flex;gap:12px;margin-top:28px}
  .result-cta .btn{flex:1}

  /* ---------- English preview ---------- */
  .preview{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:34px 28px;text-align:center;margin-top:8px}
  .preview .big{font-size:2.6rem;margin-bottom:8px}
  .preview h3{font-size:1.3rem;font-weight:700}
  .preview p{color:var(--ink-soft);font-weight:500;max-width:440px;margin:8px auto 0}
  .plan{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px;margin:24px auto 0;text-align:left}
  .plan .p{background:var(--paper);border-radius:14px;padding:14px 16px}
  .plan .p .t{font-weight:700}
  .plan .p .d{font-size:.8rem;color:var(--ink-soft);font-weight:500;margin-top:2px}

  /* ---------- 獎勵系統 ---------- */
  .reward-teaser{
    margin:22px 0 0;padding:18px 20px;border-radius:20px;
    background:linear-gradient(135deg,#FFF9E6,#FFF0CC);
    border:2px dashed var(--sun);text-align:center;
  }
  .reward-teaser .rt-label{font-size:.78rem;font-weight:700;color:#A07000;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
  .reward-teaser .rt-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .reward-teaser .rt-badge{
    background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:.85rem;
    box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:6px;
  }
  .reward-teaser p{font-size:.82rem;color:#806000;font-weight:500}
  .reward-overlay{
    position:fixed;inset:0;background:rgba(46,49,72,.55);backdrop-filter:blur(6px);
    display:grid;place-items:center;z-index:999;padding:20px;
  }
  .reward-modal{
    background:#fff;border-radius:28px;padding:0;max-width:520px;width:100%;
    box-shadow:0 24px 60px rgba(46,49,72,.22);overflow:hidden;position:relative;
    animation:modalIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes modalIn{from{transform:scale(.7) translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .reward-modal .rm-header{padding:30px 28px 22px;text-align:center;}
  .reward-modal .rm-firework{font-size:3rem;line-height:1;margin-bottom:8px}
  .reward-modal .rm-title{font-size:1.45rem;font-weight:700}
  .reward-modal .rm-sub{font-size:.9rem;color:var(--ink-soft);font-weight:500;margin-top:4px}
  .coupon{
    margin:0 22px 22px;border-radius:20px;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.14);position:relative;
  }
  .coupon::before,.coupon::after{
    content:'';position:absolute;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;background:#f5f5f5;z-index:2;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);
  }
  .coupon::before{left:-13px;} .coupon::after{right:-13px;}
  .coupon-top{padding:22px 28px 16px;position:relative;}
  .coupon-top .ct-label{font-size:.7rem;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.7);text-transform:uppercase;margin-bottom:5px}
  .coupon-top .ct-title{font-size:1.55rem;font-weight:700;color:#fff;line-height:1.25;max-width:75%}
  .coupon-top .ct-icon{font-size:2.8rem;position:absolute;right:22px;top:18px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
  .coupon-divider{height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0,rgba(255,255,255,.45) 8px,transparent 8px,transparent 18px);}
  .coupon-bottom{padding:14px 28px 18px;position:relative;}
  .coupon-bottom .cb-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px}
  .coupon-bottom .cb-item .cbi-label{font-size:.66rem;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:1px;text-transform:uppercase}
  .coupon-bottom .cb-item .cbi-val{font-size:.92rem;font-weight:700;color:#fff;margin-top:1px}
  .coupon-bottom .cb-note{font-size:.72rem;color:rgba(255,255,255,.6);font-weight:500}
  .coupon-stamp{
    position:absolute;right:20px;bottom:12px;
    width:52px;height:52px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.45);
    display:grid;place-items:center;font-size:1.5rem;
    background:rgba(255,255,255,.12);
  }
  .rm-footer{padding:0 22px 22px;display:flex;flex-direction:column;gap:10px}
  .rm-print-note{font-size:.75rem;color:var(--ink-soft);text-align:center;font-weight:500}
  .rm-close{background:none;border:none;font-family:inherit;color:var(--ink-soft);font-size:.86rem;font-weight:600;cursor:pointer;text-align:center;padding:6px;text-decoration:underline}
  .rm-close:hover{color:var(--ink)}
  .confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:1000;overflow:hidden}
  .conf{position:absolute;top:-10px;width:10px;height:14px;border-radius:3px;animation:confFall linear forwards}
  @keyframes confFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

  .hidden{display:none}
  /* sparkle */
  .sparkle{position:absolute;font-size:1.2rem;animation:pop 1.1s ease forwards;pointer-events:none}
  @keyframes pop{0%{transform:translateY(0) scale(0);opacity:0}30%{opacity:1}100%{transform:translateY(-60px) scale(1.2);opacity:0}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
  .foot{text-align:center;color:var(--ink-soft);font-size:.78rem;font-weight:500;margin-top:34px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">

  <header class="app">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2 2 0 0 1 6 3.5h11a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2v-13Z" stroke="#fff" stroke-width="1.7"/><path d="M8 3.5v17" stroke="#fff" stroke-width="1.5"/><path d="M11 8.5h4M11 12h4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>暑假練習本</h1>
        <p>每天練一點，開學沒煩惱</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tab-math" onclick="switchSubject('math')">數學</button>
      <button class="tab" id="tab-eng" onclick="switchSubject('eng')">英文</button>
    </div>
  </header>

  <!-- ============ SETUP ============ -->
  <main id="view-setup">
    <div class="greet">
      <h2><span class="wave">👋</span> 嗨！今天想練哪一個單元？</h2>
      <p>選一個主題，挑好難度和題數，就可以開始囉。</p>
    </div>

    <div class="section-label">年級</div>
    <div class="chips" id="grade-chips">
      <button class="chip on" data-grade="5">五年級</button>
      <button class="chip" data-grade="6">六年級</button>
    </div>

    <div class="section-label">數學單元</div>
    <div class="topic-grid" id="topic-grid"></div>

    <div class="controls">
      <div class="ctrl-block">
        <div class="section-label" style="margin-top:24px">難度</div>
        <div class="chips" id="diff-chips">
          <button class="chip" data-diff="1">簡單</button>
          <button class="chip on" data-diff="2">普通</button>
          <button class="chip" data-diff="3">挑戰</button>
        </div>
      </div>
      <div class="ctrl-block">
        <div class="section-label" style="margin-top:24px">題數</div>
        <div class="chips" id="count-chips">
          <button class="chip" data-count="5">5 題</button>
          <button class="chip on" data-count="10">10 題</button>
          <button class="chip" data-count="20">20 題</button>
        </div>
      </div>
    </div>

    <div class="cta-row">
      <button class="btn btn-primary" id="start-btn" onclick="startPractice()">開始練習 ✏️</button>
    </div>
  </main>

  <!-- ============ PRACTICE ============ -->
  <main id="view-practice" class="hidden">
    <div class="pbar-top">
      <div class="meta">第 <b id="qnow">1</b> / <span id="qtotal">10</span> 題</div>
      <div class="topicname" id="ptopic">小數加減</div>
    </div>
    <div class="progress"><i id="pfill" style="width:10%"></i></div>

    <div class="qcard">
      <span class="qtag" id="qtag">小數加減</span>
      <div class="qtext" id="qtext"></div>
      <div class="visual" id="qvisual"></div>
      <div class="answer-area" id="answer-area"></div>
      <div class="hint" id="qhint"></div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="prev-btn" onclick="prevQ()">← 上一題</button>
      <button class="btn btn-primary" id="next-btn" style="width:auto" onclick="nextQ()">下一題 →</button>
    </div>
  </main>

  <!-- ============ RESULT ============ -->
  <main id="view-result" class="hidden">
    <div class="result-head" id="result-head"></div>
    <div class="dots" id="dots"></div>
    <div class="review" id="review"></div>
    <div class="result-cta">
      <button class="btn btn-ghost" onclick="backToSetup()">← 換主題</button>
      <button class="btn btn-primary" style="width:auto" onclick="retrySame()">再做一份 ↻</button>
    </div>
  </main>

  <!-- ============ ENGLISH PREVIEW ============ -->
  <main id="view-eng" class="hidden">
    <div class="preview">
      <div class="big">🔤</div>
      <h3>英文練習，規劃中</h3>
      <p>英文題目沒辦法像數學一樣用公式自動生成，需要先準備一份校對過的題庫。下面是預計會做的題型：</p>
      <div class="plan">
        <div class="p"><div class="t">單字選擇</div><div class="d">看中文選英文，或看圖選字</div></div>
        <div class="p"><div class="t">克漏字</div><div class="d">句子挖空，從選項補上正確的字</div></div>
        <div class="p"><div class="t">句子重組</div><div class="d">把打散的單字排成正確句子</div></div>
        <div class="p"><div class="t">文法選擇</div><div class="d">時態、單複數、介系詞練習</div></div>
      </div>
    </div>
  </main>

  <!-- ============ REWARD OVERLAY ============ -->
  <div id="reward-overlay" class="reward-overlay hidden" onclick="closeReward(event)">
    <div class="reward-modal" id="reward-modal">
      <div class="rm-header">
        <div class="rm-firework" id="rm-firework"></div>
        <div class="rm-title" id="rm-title"></div>
        <div class="rm-sub" id="rm-sub"></div>
      </div>
      <div class="coupon" id="coupon">
        <div class="coupon-top" id="coupon-top">
          <div class="ct-label">🏆 獎勵兌換券</div>
          <div class="ct-title" id="ct-title"></div>
          <div class="ct-icon" id="ct-icon"></div>
        </div>
        <div class="coupon-divider"></div>
        <div class="coupon-bottom" id="coupon-bottom">
          <div class="cb-row" id="cb-row"></div>
          <div class="cb-note">請出示給爸爸媽媽，由家長確認兌換 ✓</div>
          <div class="coupon-stamp" id="coupon-stamp"></div>
        </div>
      </div>
      <div class="rm-footer">
        <button class="btn btn-primary" onclick="window.print()">🖨️ 列印兌換券</button>
        <button class="rm-close" onclick="closeReward()">先看錯題分析</button>
      </div>
    </div>
  </div>

  <div class="foot">這是互動原型 · 數學題目皆為實際運算產生，可真的作答與批改</div>
</div>

<script>
/* =========================================================
   小工具
========================================================= */
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function simp(n,d){const g=gcd(n,d);return [n/g,d/g];}
// 用整數運算避免浮點誤差，回傳乾淨的小數
function decAdd(a,b,scale){return Math.round(a*scale + b*scale)/scale;}
function decSub(a,b,scale){return Math.round(a*scale - b*scale)/scale;}
function trimNum(x){return parseFloat(x.toFixed(6)).toString();}
function lcm(a,b){return a/gcd(a,b)*b;}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
// 兩個不相等且互質的數
function coprimePair(lo,hi){let p,q;do{p=rnd(lo,hi);q=rnd(lo,hi);}while(p===q||gcd(p,q)!==1);return [p,q];}
const N = x=>`<span class="num">${x}</span>`;
// 分數答案的共用欄位
function fracAns(n,d){
  const [rn,rd]=simp(n,d);
  return {input:'fraction', isFrac:true, answers:[(rn/rd).toFixed(6)], ansLabel:fracText(rn,rd)};
}
function fracDisp(n,d){const [rn,rd]=simp(n,d);return rd===1?N(rn):fracHTML(rn,rd);}

function fracHTML(n,d){
  return `<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
}
function fracText(n,d){
  // 假分數轉帶分數顯示
  if(d===1) return `${n}`;
  if(Math.abs(n)>=d){
    const w=Math.trunc(n/d), r=Math.abs(n%d);
    return r===0 ? `${w}` : `${w} ${r}/${d}`;
  }
  return `${n}/${d}`;
}

function cuboidSVG(l,w,h){
  return `<svg viewBox="0 0 200 160" width="190" height="150" xmlns="http://www.w3.org/2000/svg">
    <polygon points="40,55 130,55 165,30 75,30" fill="#EEEDFB" stroke="#5A55D6" stroke-width="2"/>
    <polygon points="40,55 130,55 130,125 40,125" fill="#FFFFFF" stroke="#5A55D6" stroke-width="2"/>
    <polygon points="130,55 165,30 165,100 130,125" fill="#E4EAFF" stroke="#5A55D6" stroke-width="2"/>
    <text x="85" y="145" font-family="-apple-system, PingFang TC, system-ui" font-size="15" font-weight="600" fill="#5A55D6" text-anchor="middle">長 ${l}</text>
    <text x="150" y="135" font-family="-apple-system, PingFang TC, system-ui" font-size="15" font-weight="600" fill="#5A55D6" text-anchor="middle">寬 ${w}</text>
    <text x="20" y="95" font-family="-apple-system, PingFang TC, system-ui" font-size="15" font-weight="600" fill="#5A55D6" text-anchor="middle">高 ${h}</text>
  </svg>`;
}

function circleSVG(label, isRadius){
  const line = isRadius
    ? '<line x1="100" y1="78" x2="162" y2="78" stroke="#F26D6D" stroke-width="2.5"/>'
    : '<line x1="38" y1="78" x2="162" y2="78" stroke="#F26D6D" stroke-width="2.5"/>';
  return `<svg viewBox="0 0 200 170" width="190" height="160" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="78" r="62" fill="#EEEDFB" stroke="#5A55D6" stroke-width="2"/>
    ${line}
    <circle cx="100" cy="78" r="3.5" fill="#5A55D6"/>
    <text x="100" y="164" font-family="-apple-system, PingFang TC, system-ui" font-size="15" font-weight="600" fill="#5A55D6" text-anchor="middle">${label}</text>
  </svg>`;
}

function sectorSVG(deg, r){
  const cx=100, cy=85, R=62, t=deg*Math.PI/180;
  const ex=(cx+R*Math.cos(t)).toFixed(1), ey=(cy-R*Math.sin(t)).toFixed(1);
  const lx=(cx+24*Math.cos(t/2)).toFixed(1), ly=(cy-24*Math.sin(t/2)+5).toFixed(1);
  return `<svg viewBox="0 0 200 170" width="190" height="160" xmlns="http://www.w3.org/2000/svg">
    <path d="M${cx} ${cy} L${cx+R} ${cy} A${R} ${R} 0 ${deg>180?1:0} 0 ${ex} ${ey} Z" fill="#EEEDFB" stroke="#5A55D6" stroke-width="2" stroke-linejoin="round"/>
    <text x="${cx+R/2}" y="${cy+18}" font-family="-apple-system, PingFang TC, system-ui" font-size="14" font-weight="600" fill="#5A55D6" text-anchor="middle">${r} 公分</text>
    <text x="${lx}" y="${ly}" font-family="-apple-system, PingFang TC, system-ui" font-size="13" font-weight="700" fill="#F26D6D" text-anchor="middle">${deg}°</text>
  </svg>`;
}

/* =========================================================
   出題器：每個回傳 { tag, html, visual, input, answers, hint, review }
   input: 'number' | 'fraction' | 'ratio' | 'time'
========================================================= */
/* =========================================================
   出題器（全部重寫 v2）
========================================================= */
const GEN = {

  /* ── 1. 小數：乘除運算 ── */
  decimal(diff){
    const type = pick(diff===1 ? ['intXdec','intXdec'] : ['intXdec','decXdec','decDivInt']);

    if(type==='intXdec'){
      // 整數 × 小數
      const places = diff===1 ? 1 : (diff===2 ? pick([1,2]) : 2);
      const scale = Math.pow(10,places);
      const a = rnd(2, diff===1?9:19);
      const bRaw = rnd(1, scale*(diff===1?9:15));
      const b = parseFloat((bRaw/scale).toFixed(places));
      const ans = parseFloat((a*bRaw/scale).toFixed(places));
      return {
        tag:'小數', subtype:'整數×小數',
        html:`<span class="num">${a}</span> × <span class="num">${b}</span> = ？`,
        input:'number', answers:[trimNum(ans)],
        hint:'把小數乘法想成先算整數，再把小數點移回去。',
        review:`${a} × ${b}`
      };
    }
    if(type==='decXdec'){
      // 小數 × 小數（各一位）
      const a = rnd(11,99)/10, b = rnd(11,99)/10;
      const ans = Math.round(a*10*b*10)/100;
      return {
        tag:'小數', subtype:'小數×小數',
        html:`<span class="num">${a.toFixed(1)}</span> × <span class="num">${b.toFixed(1)}</span> = ？`,
        input:'number', answers:[trimNum(ans)],
        hint:'兩個小數各有幾位，答案就有幾位小數。',
        review:`${a.toFixed(1)} × ${b.toFixed(1)}`
      };
    }
    // 小數 ÷ 整數
    {
      const divisor = rnd(2, diff===2?9:12);
      const quot = rnd(1, diff===2?20:40);
      const places = pick([1,2]);
      const scale = Math.pow(10,places);
      // dividend 設計成整除，答案乾淨
      const dividend = parseFloat((divisor*quot/scale).toFixed(places));
      return {
        tag:'小數', subtype:'小數÷整數',
        html:`<span class="num">${dividend}</span> ÷ <span class="num">${divisor}</span> = ？`,
        input:'number', answers:[trimNum(quot/scale)],
        hint:'先算整數除法，再決定小數點的位置。',
        review:`${dividend} ÷ ${divisor}`
      };
    }
  },

  /* ── 2. 分數：倍與除 ── */
  fraction(diff){
    const type = pick(['intFrac','fracFrac','fracDivInt']);

    if(type==='intFrac'){
      // 整數的分數倍
      const d = rnd(2,9);
      // 讓整數是 d 的倍數，答案是整數
      const mult = rnd(1,6);
      const whole = d * mult;
      const n = rnd(1,d-1);
      const rawNum = whole*n, rawDen = d;
      const [rn,rd] = simp(rawNum,rawDen);
      const val = rn/rd;
      return {
        tag:'分數', subtype:'整數的分數倍',
        html:`<span class="num">${whole}</span> 的 ${fracHTML(n,d)} 倍是多少？`,
        input:'fraction', answers:[val.toFixed(6)], isFrac:true,
        hint:'整數 × 分數 = 整數 × 分子 ÷ 分母。',
        review:`${whole} 的 ${n}/${d} 倍`,
        ansLabel: fracText(rn,rd)
      };
    }
    if(type==='fracFrac'){
      // 分數的分數倍
      const d1=rnd(2,8), n1=rnd(1,d1-1);
      const d2=rnd(2,8), n2=rnd(1,d2-1);
      const rawNum=n1*n2, rawDen=d1*d2;
      const [rn,rd]=simp(rawNum,rawDen);
      return {
        tag:'分數', subtype:'分數×分數',
        html:`${fracHTML(n1,d1)} 的 ${fracHTML(n2,d2)} 倍是多少？`,
        input:'fraction', answers:[(rn/rd).toFixed(6)], isFrac:true,
        hint:'分數乘分數：分子乘分子、分母乘分母，最後約分。',
        review:`${n1}/${d1} × ${n2}/${d2}`,
        ansLabel: fracText(rn,rd)
      };
    }
    // 分數 ÷ 整數
    {
      const d=rnd(2,9), n=rnd(1,d-1);
      const divisor = pick(diff===1?[2,3,4]:diff===2?[2,3,4,5,6]:[2,3,4,5,6,7,8]);
      const rawDen = d*divisor;
      const [rn,rd] = simp(n,rawDen);
      return {
        tag:'分數', subtype:'分數÷整數',
        html:`${fracHTML(n,d)} ÷ <span class="num">${divisor}</span> = ？`,
        input:'fraction', answers:[(rn/rd).toFixed(6)], isFrac:true,
        hint:'分數除以整數：分母乘以那個整數，分子不變。',
        review:`${n}/${d} ÷ ${divisor}`,
        ansLabel: fracText(rn,rd)
      };
    }
  },

  /* ── 3. 體積：含比較與組合 ── */
  volume(diff){
    const type = pick(diff===1 ? ['single','single','compare'] : ['single','compare','combine']);
    const hi = diff===1?8:diff===2?12:16;

    if(type==='single'){
      const l=rnd(2,hi), w=rnd(2,hi), h=rnd(2,hi);
      return {
        tag:'體積', subtype:'基本計算',
        html:`一個長方體，長 <span class="num">${l}</span> 公分、寬 <span class="num">${w}</span> 公分、高 <span class="num">${h}</span> 公分，體積是多少立方公分？`,
        visual:cuboidSVG(l,w,h),
        input:'number', answers:[(l*w*h).toString()], unit:'立方公分',
        hint:'長方體體積 = 長 × 寬 × 高。',
        review:`長方體 ${l}×${w}×${h} 體積`
      };
    }
    if(type==='compare'){
      const l1=rnd(2,hi),w1=rnd(2,hi),h1=rnd(2,hi);
      const l2=rnd(2,hi),w2=rnd(2,hi),h2=rnd(2,hi);
      const v1=l1*w1*h1, v2=l2*w2*h2;
      const diff_=Math.abs(v1-v2);
      const bigger = v1>v2 ? 'A':'B';
      return {
        tag:'體積', subtype:'體積比較',
        html:`甲箱：長 <span class="num">${l1}</span>、寬 <span class="num">${w1}</span>、高 <span class="num">${h1}</span> 公分。<br>乙箱：長 <span class="num">${l2}</span>、寬 <span class="num">${w2}</span>、高 <span class="num">${h2}</span> 公分。<br>甲箱比乙箱的體積多（或少）多少立方公分？（正數代表甲多，負數代表乙多）`,
        input:'number', answers:[(v1-v2).toString()], unit:'立方公分',
        hint:'分別算兩個體積，再相減。甲多就是正數，乙多就填負數。',
        review:`甲(${l1}×${w1}×${h1}) vs 乙(${l2}×${w2}×${h2})`,
        ansLabel:`${v1-v2} 立方公分`
      };
    }
    // combine: 挖空（大 - 小）
    {
      const L=rnd(6,hi+4), W=rnd(6,hi+4), H=rnd(6,hi+4);
      const l=rnd(1,Math.floor(L/2)), w=rnd(1,Math.floor(W/2)), h=H; // 挖通孔
      const ans = L*W*H - l*w*h;
      return {
        tag:'體積', subtype:'挖空計算',
        html:`一個大長方體長 <span class="num">${L}</span>、寬 <span class="num">${W}</span>、高 <span class="num">${H}</span> 公分，<br>從正上方挖去一個長 <span class="num">${l}</span>、寬 <span class="num">${w}</span>、高 <span class="num">${h}</span> 公分的長方體，<br>剩下的體積是多少立方公分？`,
        input:'number', answers:[ans.toString()], unit:'立方公分',
        hint:'大體積 − 小體積 = 剩餘體積。',
        review:`大(${L}×${W}×${H}) − 小(${l}×${w}×${h})`
      };
    }
  },

  /* ── 4. 表面積：含比較與組合 ── */
  surface(diff){
    const type = pick(diff===1 ? ['single','single'] : ['single','remove','stack']);
    const hi = diff===1?8:diff===2?10:14;

    if(type==='single'){
      const l=rnd(2,hi), w=rnd(2,hi), h=rnd(2,hi);
      const ans = 2*(l*w+l*h+w*h);
      return {
        tag:'表面積', subtype:'基本計算',
        html:`一個長方體，長 <span class="num">${l}</span>、寬 <span class="num">${w}</span>、高 <span class="num">${h}</span> 公分，表面積是多少平方公分？`,
        visual:cuboidSVG(l,w,h),
        input:'number', answers:[ans.toString()], unit:'平方公分',
        hint:'表面積 = 2×(長×寬 + 長×高 + 寬×高)。',
        review:`長方體 ${l}×${w}×${h} 表面積`
      };
    }
    if(type==='remove'){
      // 兩個相同正方體拼在一起，計算合體後表面積
      const s = rnd(2,hi);
      // 單個正方體表面積 = 6s²；拼在一起少了兩個 s×s 面
      const ans = 2*6*s*s - 2*s*s;
      return {
        tag:'表面積', subtype:'拼合計算',
        html:`兩個邊長 <span class="num">${s}</span> 公分的正方體，<br>完全貼合拼在一起後，總表面積是多少平方公分？`,
        input:'number', answers:[ans.toString()], unit:'平方公分',
        hint:'先算兩個正方體各自的表面積，拼合處每邊少掉 2 個面。',
        review:`兩個邊長 ${s} 的正方體拼合`
      };
    }
    // stack: 大減小（上面疊一個）
    {
      const L=rnd(6,hi+4), W=rnd(6,hi+4), H1=rnd(2,6);
      const l=rnd(2,L-2), w=rnd(2,W-2), H2=rnd(2,5);
      // 底座表面積 + 頂面（底座去掉疊放處）+ 側面 + 小方塊5面
      const base5 = 2*(L*H1)+2*(W*H1)+L*W; // 底座5面（頂面之後要挖掉 l*w）
      const topOpen = L*W - l*w;            // 底座頂面扣掉小方塊底部
      const small5 = 2*(l*H2)+2*(w*H2)+l*w; // 小方塊5面（底面貼著底座）
      const ans = base5 + topOpen + small5;
      return {
        tag:'表面積', subtype:'疊加計算',
        html:`一個長 <span class="num">${L}</span>、寬 <span class="num">${W}</span>、高 <span class="num">${H1}</span> 公分的底座，<br>上面再疊一個長 <span class="num">${l}</span>、寬 <span class="num">${w}</span>、高 <span class="num">${H2}</span> 公分的小方塊，<br>整體的外表面積是多少平方公分？`,
        input:'number', answers:[ans.toString()], unit:'平方公分',
        hint:'底座5面（頂面要扣掉被蓋住的部分）+ 小方塊5面（底面被蓋住不算）。',
        review:`底座${L}×${W}×${H1} 疊 ${l}×${w}×${H2}`
      };
    }
  },

  /* ── 5. 時間計算 ── */
  time(diff){
    const type = pick(diff===1 ? ['elapsed','elapsed'] : ['elapsed','schedule','total']);
    const f=n=>n.toString().padStart(2,'0');

    if(type==='elapsed'){
      const h1=rnd(7,18), m1=pick(diff===1?[0,10,15,20,30,40,45]:[0,5,8,12,18,25,35,42,50,55]);
      const addMin = diff===1?rnd(20,90):diff===2?rnd(30,150):rnd(60,260);
      const total=h1*60+m1+addMin;
      const h2=Math.floor(total/60), m2=total%60;
      const dh=Math.floor(addMin/60), dm=addMin%60;
      const scenes=[
        `小明從 <span class="num">${h1}:${f(m1)}</span> 開始看書，到 <span class="num">${h2}:${f(m2)}</span> 才停下來，<br>一共看了多少時間？`,
        `學校的體育課從 <span class="num">${h1}:${f(m1)}</span> 上到 <span class="num">${h2}:${f(m2)}</span>，<br>這節課有多長？`,
        `媽媽 <span class="num">${h1}:${f(m1)}</span> 出門，<span class="num">${h2}:${f(m2)}</span> 回家，<br>她出門了多久？`
      ];
      return {
        tag:'時間計算', subtype:'經過時間',
        html:pick(scenes), input:'time', answers:[{h:dh,m:dm}],
        hint:'結束時間 − 開始時間，分鐘不夠就向小時借 60 分。',
        review:`${h1}:${f(m1)} → ${h2}:${f(m2)}`, ansLabel:`${dh} 時 ${dm} 分`
      };
    }
    if(type==='schedule'){
      // 知道開始和經過，求結束
      const h1=rnd(7,16), m1=pick([0,10,15,20,30,40,45]);
      const dh=rnd(0,3), dm=pick([0,10,15,20,25,30,40,45,50]);
      const addMin=dh*60+dm;
      if(addMin===0){ return GEN.time(diff); }
      const total=h1*60+m1+addMin;
      const h2=Math.floor(total/60), m2=total%60;
      return {
        tag:'時間計算', subtype:'推算結束時間',
        html:`小華 <span class="num">${h1}:${f(m1)}</span> 開始練琴，練了 <span class="num">${dh}</span> 小時 <span class="num">${dm}</span> 分鐘，<br>他幾點練完？`,
        input:'time', answers:[{h:h2,m:m2}],
        hint:'把小時和分鐘分別加上去，分鐘超過 60 要進位到小時。',
        review:`${h1}:${f(m1)} 加 ${dh}時${dm}分`, ansLabel:`${h2}:${f(m2)}`
      };
    }
    // total: 多段時間相加
    {
      const seg = rnd(2,3);
      const parts=[];
      for(let i=0;i<seg;i++) parts.push({h:rnd(0,2),m:pick([5,10,15,20,25,30])});
      const totalMin=parts.reduce((s,p)=>s+p.h*60+p.m,0);
      const rh=Math.floor(totalMin/60), rm=totalMin%60;
      const desc=parts.map(p=>`<span class="num">${p.h}</span> 小時 <span class="num">${p.m}</span> 分鐘`).join('、');
      return {
        tag:'時間計算', subtype:'時間加總',
        html:`小英今天練習了 ${seg} 項才藝，分別花了 ${desc}，<br>合計練習了多久？`,
        input:'time', answers:[{h:rh,m:rm}],
        hint:'分鐘全部加起來，每滿 60 分就換成 1 小時。',
        review:parts.map(p=>`${p.h}h${p.m}m`).join('+'), ansLabel:`${rh} 時 ${rm} 分`
      };
    }
  },

  /* ── 6. 容積：含物體、外殼扣除 ── */
  capacity(diff){
    const type = pick(diff===1
      ? ['fillBox','waterRise']
      : ['fillBox','waterRise','shellBox','overflow']);

    if(type==='fillBox'){
      // 容器能裝多少水（內部尺寸）
      const l=rnd(5,diff===1?15:25), w=rnd(5,diff===1?15:25), h=rnd(5,diff===1?15:20);
      return {
        tag:'容積', subtype:'裝水計算',
        html:`一個長方形水箱，內部長 <span class="num">${l}</span> 公分、寬 <span class="num">${w}</span> 公分、高 <span class="num">${h}</span> 公分，<br>裝滿水的話，容積是多少毫升？（1 立方公分 = 1 毫升）`,
        visual:cuboidSVG(l,w,h),
        input:'number', answers:[(l*w*h).toString()], unit:'毫升',
        hint:'容積 = 長 × 寬 × 高（用內部尺寸），1 立方公分 = 1 毫升。',
        review:`水箱 ${l}×${w}×${h} 容積`
      };
    }
    if(type==='waterRise'){
      // 把物體放進水中，水面上升
      const L=rnd(10,25), W=rnd(10,25);
      const ol=rnd(2,Math.floor(L/2)), ow=rnd(2,Math.floor(W/2)), oh=rnd(2,10);
      const rise = parseFloat((ol*ow*oh/(L*W)).toFixed(2));
      // 確保答案乾淨
      if(ol*ow*oh % (L*W) !== 0){
        // 若不整除就重試一個整除情況
        const simple_vol = L*W*rnd(1,5);
        const objH=simple_vol/(L*W);
        return {
          tag:'容積', subtype:'水位上升',
          html:`一個底面長 <span class="num">${L}</span> 公分、寬 <span class="num">${W}</span> 公分的水箱裡，<br>放入一個體積為 <span class="num">${simple_vol}</span> 立方公分的石頭，<br>水面會上升幾公分？`,
          input:'number', answers:[objH.toString()], unit:'公分',
          hint:'物體體積 ÷ 底面積 = 水面上升高度。',
          review:`底${L}×${W}，石頭體積${simple_vol}`
        };
      }
      return {
        tag:'容積', subtype:'水位上升',
        html:`一個底面長 <span class="num">${L}</span>、寬 <span class="num">${W}</span> 公分的水箱，<br>放入一個長 <span class="num">${ol}</span>、寬 <span class="num">${ow}</span>、高 <span class="num">${oh}</span> 公分的積木，<br>水面會上升幾公分？`,
        input:'number', answers:[(ol*ow*oh/(L*W)).toString()], unit:'公分',
        hint:'積木體積 ÷ 水箱底面積 = 水面上升高度。',
        review:`水箱底${L}×${W}，積木${ol}×${ow}×${oh}`
      };
    }
    if(type==='shellBox'){
      // 外殼厚度：外部尺寸 - 2×厚度 = 內部
      const thick = pick([1,2]);
      const outL=rnd(10,25), outW=rnd(10,25), outH=rnd(8,20);
      const inL=outL-2*thick, inW=outW-2*thick, inH=outH-thick; // 底有厚度，頂開口
      const vol=inL*inW*inH;
      return {
        tag:'容積', subtype:'扣除外殼',
        html:`一個開口長方形盒子，外部長 <span class="num">${outL}</span>、寬 <span class="num">${outW}</span>、高 <span class="num">${outH}</span> 公分，<br>盒壁與底部厚度都是 <span class="num">${thick}</span> 公分（頂部開口），<br>這個盒子的容積是多少立方公分？`,
        input:'number', answers:[vol.toString()], unit:'立方公分',
        hint:'內部尺寸 = 外部尺寸 − 2×壁厚（左右各一），高度只扣底部一層。',
        review:`外${outL}×${outW}×${outH}，壁厚${thick}`
      };
    }
    // overflow: 水倒入太滿，溢出多少
    {
      const l=rnd(8,20), w=rnd(8,20), h=rnd(8,18);
      const cap=l*w*h;
      const over=rnd(1,5)*(l*w); // 整除讓高度是整數
      return {
        tag:'容積', subtype:'溢出計算',
        html:`一個長 <span class="num">${l}</span>、寬 <span class="num">${w}</span>、高 <span class="num">${h}</span> 公分的水桶（無蓋），<br>裡面已經裝了 <span class="num">${cap+over}</span> 毫升的水，<br>會溢出多少毫升？`,
        input:'number', answers:[over.toString()], unit:'毫升',
        hint:'先算水桶容積，再用總水量減掉容積，就是溢出的量。',
        review:`桶${l}×${w}×${h}，水${cap+over}mL`
      };
    }
  },

  /* ── 7. 比例：含生活情境 ── */
  ratio(diff){
    const type = pick(diff===1
      ? ['simplify','simplify','life']
      : ['simplify','life','share','missing']);

    if(type==='simplify'){
      let p,q;
      do{ p=rnd(1,9); q=rnd(1,9);}while(gcd(p,q)!==1 || p===q);
      const k=diff===1?rnd(2,4):rnd(2,8);
      const a=p*k, b=q*k;
      return {
        tag:'比例', subtype:'化最簡比',
        html:`把 <span class="num">${a} : ${b}</span> 化成最簡單的整數比。`,
        input:'ratio', answers:[`${p}:${q}`],
        hint:'找出最大公因數，分別除掉就好。',
        review:`${a} : ${b}`, ansLabel:`${p} : ${q}`
      };
    }
    if(type==='life'){
      const scenes=[
        ()=>{
          const boys=rnd(2,7)*3, girls=rnd(2,7)*4;
          const [p,q]=simp(boys,girls);
          return {
            html:`班上有男生 <span class="num">${boys}</span> 人，女生 <span class="num">${girls}</span> 人，<br>男生與女生的人數比（最簡）是多少？`,
            ans:`${p}:${q}`, review:`男${boys}:女${girls}`, label:`${p} : ${q}`,
            hint:'把男生人數和女生人數寫成比，再化最簡。'
          };
        },
        ()=>{
          let j=rnd(1,4),w=rnd(1,4); if(j===w)w++;
          const k=rnd(2,5), jml=j*k*100, wml=w*k*100;
          const [p,q]=simp(j,w);
          return {
            html:`一杯果汁飲料，果汁 <span class="num">${jml}</span> 毫升，水 <span class="num">${wml}</span> 毫升，<br>果汁與水的比（最簡）是多少？`,
            ans:`${p}:${q}`, review:`果汁${jml}:水${wml}`, label:`${p} : ${q}`,
            hint:'果汁:水，化最簡整數比。'
          };
        },
        ()=>{
          const red=rnd(2,5)*6, blue=rnd(2,5)*4;
          const [p,q]=simp(red,blue);
          return {
            html:`籃子裡有紅球 <span class="num">${red}</span> 顆、藍球 <span class="num">${blue}</span> 顆，<br>紅球與藍球的比（最簡）是多少？`,
            ans:`${p}:${q}`, review:`紅${red}:藍${blue}`, label:`${p} : ${q}`,
            hint:'數量比，化最簡整數比。'
          };
        }
      ];
      const sc=pick(scenes)();
      return {
        tag:'比例', subtype:'生活應用',
        html:sc.html, input:'ratio', answers:[sc.ans],
        hint:sc.hint, review:sc.review, ansLabel:sc.label
      };
    }
    if(type==='share'){
      // 按比例分配
      let p,q;
      do{ p=rnd(1,6); q=rnd(1,6);}while(p===q);
      const total=(p+q)*rnd(2,8);
      const shareA=total*p/(p+q);
      return {
        tag:'比例', subtype:'按比例分配',
        html:`哥哥和妹妹按照 <span class="num">${p} : ${q}</span> 的比例分 <span class="num">${total}</span> 顆糖，<br>哥哥可以得到幾顆？`,
        input:'number', answers:[shareA.toString()], unit:'顆',
        hint:`總份數 = ${p}+${q}，哥哥佔 ${p} 份：${total} ÷ ${p+q} × ${p}。`,
        review:`${total} 顆按 ${p}:${q} 分，求大份`
      };
    }
    // missing: 找第四比例項
    {
      let p,q;
      do{ p=rnd(2,8); q=rnd(2,8);}while(p===q);
      const k=rnd(2,6);
      const a=p*k, b=q*k;
      const ask=pick(['c','d']);
      if(ask==='c'){
        const newD=rnd(2,5)*(q);
        const newC=p*(newD/q);
        return {
          tag:'比例', subtype:'求比例項',
          html:`<span class="num">${a} : ${b} = ？ : ${newD}</span>，問號是多少？`,
          input:'number', answers:[newC.toString()],
          hint:'比例的前項或後項乘以同一個數，比值不變。',
          review:`${a}:${b} = ?:${newD}`
        };
      } else {
        const newC=rnd(2,5)*(p);
        const newD=q*(newC/p);
        return {
          tag:'比例', subtype:'求比例項',
          html:`<span class="num">${a} : ${b} = ${newC} : ？</span>，問號是多少？`,
          input:'number', answers:[newD.toString()],
          hint:'前項乘以幾，後項也要乘以同一個數。',
          review:`${a}:${b} = ${newC}:?`
        };
      }
    }
  },

  /* ── 8. 百分率：含生活情境 ── */
  percent(diff){
    const type = pick(diff===1
      ? ['ofWhole','whichPct']
      : ['ofWhole','whichPct','discount','survey','change']);

    const nicePct=[10,20,25,40,50,60,75,80];

    if(type==='ofWhole'){
      const p=pick(nicePct);
      const whole=rnd(2,diff===3?50:20)*(diff===1?10:5);
      const ans=whole*p/100;
      return {
        tag:'百分率', subtype:'求幾%是多少',
        html:`全班 <span class="num">${whole}</span> 位同學中，有 <span class="num">${p}%</span> 的同學喜歡數學，<br>喜歡數學的有幾位？`,
        input:'number', answers:[trimNum(ans)], unit:'位',
        hint:'全體人數 × 百分率（先÷100）= 部分人數。',
        review:`${whole} 的 ${p}%`
      };
    }
    if(type==='whichPct'){
      const p=pick(nicePct), whole=rnd(2,20)*5, part=whole*p/100;
      return {
        tag:'百分率', subtype:'求百分之幾',
        html:`班上 <span class="num">${whole}</span> 人參加運動會，其中 <span class="num">${part}</span> 人參加跑步，<br>參加跑步的人占全班的百分之幾？`,
        input:'number', answers:[p.toString()], unit:'%',
        hint:'部分 ÷ 全部 × 100% = 百分率。',
        review:`${part} / ${whole} = ?%`
      };
    }
    if(type==='discount'){
      // 打折
      const orig=pick([100,150,200,250,300,400,500])*rnd(1,4);
      const discount=pick([60,70,75,80,90]); // 幾折（百分比）
      const ans=orig*discount/100;
      return {
        tag:'百分率', subtype:'打折計算',
        html:`一件衣服原價 <span class="num">${orig}</span> 元，現在打 <span class="num">${discount}%</span> 的折扣，<br>要付多少錢？`,
        input:'number', answers:[trimNum(ans)], unit:'元',
        hint:'打折後售價 = 原價 × 折扣百分率。',
        review:`${orig} 元打 ${discount}%`
      };
    }
    if(type==='survey'){
      // 給百分率求人數，或反過來
      const total=pick([20,25,40,50])*rnd(1,3);
      const p=pick(nicePct);
      const part=total*p/100;
      const q2=pick(['seek_part','seek_pct']);
      if(q2==='seek_part'){
        return {
          tag:'百分率', subtype:'生活調查',
          html:`學校調查 <span class="num">${total}</span> 名學生，結果有 <span class="num">${p}%</span> 的人每天吃早餐，<br>每天吃早餐的有幾人？`,
          input:'number', answers:[trimNum(part)], unit:'人',
          hint:'總人數 × 百分率 = 人數。',
          review:`${total} 人中 ${p}%`
        };
      } else {
        return {
          tag:'百分率', subtype:'生活調查',
          html:`學校調查 <span class="num">${total}</span> 名學生，其中 <span class="num">${part}</span> 人有帶水壺上學，<br>帶水壺的比例是百分之幾？`,
          input:'number', answers:[p.toString()], unit:'%',
          hint:'部分 ÷ 全體 × 100。',
          review:`${part}/${total} = ?%`
        };
      }
    }
    // change: 成長/減少百分比
    {
      const orig=rnd(2,20)*50;
      const p=pick([10,20,25,50]);
      const dir=pick(['up','down']);
      const change=orig*p/100;
      const ans=dir==='up'?orig+change:orig-change;
      return {
        tag:'百分率', subtype:'增減計算',
        html:`去年班上有 <span class="num">${orig}</span> 本課外書，今年${dir==='up'?'增加':'減少'}了 <span class="num">${p}%</span>，<br>今年有幾本？`,
        input:'number', answers:[trimNum(ans)], unit:'本',
        hint:`今年 = 去年 ${dir==='up'?'×(1+':'×(1−'}${p/100})。`,
        review:`${orig} ${dir==='up'?'+':'-'} ${p}%`
      };
    }
  },

  /* =================== 六年級 =================== */

  /* ── 6-1. 最大公因數與最小公倍數 ── */
  factor(diff){
    const type = pick(diff===1
      ? ['primeOrNot','findPrime','gcd','lcm']
      : ['primeOrNot','findPrime','primeCount','gcd','lcm','gcdApp','lcmApp']);
    const hi = diff===1?30:diff===2?60:100;

    if(type==='primeOrNot'){
      let n;
      if(pick([true,false])){ do{ n=rnd(2,hi); }while(!isPrime(n)); }
      // 普通以上出「看起來像質數」的奇合數（如 51、91）
      else { do{ n=rnd(4,hi); }while(isPrime(n) || (diff>1 && (n%2===0||n%5===0))); }
      return {
        tag:'質數與合數', subtype:'判斷質數',
        html:`${N(n)} 是質數還是合數？`,
        input:'choice', options:['質數','合數'], answers:[isPrime(n)?'質數':'合數'],
        hint:'質數只有 1 和自己兩個因數；合數除了 1 和自己，還有別的因數。',
        review:`${n} 是質數還是合數`
      };
    }
    if(type==='findPrime'){
      const primes=[], comps=[];
      for(let n=2;n<=hi;n++){
        if(isPrime(n)) primes.push(n);
        else if(diff===1 || (n%2 && n%5)) comps.push(n);
      }
      const p=pick(primes);
      const opts=shuffle([p,...shuffle(comps).slice(0,3)]).map(String);
      return {
        tag:'質數與合數', subtype:'找質數',
        html:`下面哪一個數是<b>質數</b>？`,
        input:'choice', options:opts, answers:[String(p)],
        hint:'用 2、3、5、7 試著去除，除得盡的就是合數。',
        review:`${opts.join('、')} 中的質數`
      };
    }
    if(type==='primeCount'){
      const top=pick(diff===2?[20,30,40]:[50,60,70]);
      let cnt=0; for(let n=2;n<=top;n++) if(isPrime(n)) cnt++;
      return {
        tag:'質數與合數', subtype:'質數個數',
        html:`1 到 ${N(top)} 之間，一共有幾個質數？`,
        input:'number', answers:[String(cnt)], unit:'個',
        hint:'1 不是質數也不是合數；把 2、3、5、7 的倍數（本身除外）刪掉，剩下的就是質數。',
        review:`1～${top} 的質數個數`
      };
    }
    if(type==='gcd'){
      const g=rnd(2,diff===1?9:diff===2?12:15);
      if(diff===3){
        let p,q,r;
        do{ p=rnd(2,9); q=rnd(2,9); r=rnd(2,9); }while(p===q||q===r||p===r||gcd(gcd(p,q),r)!==1);
        return {
          tag:'最大公因數', subtype:'三個數',
          html:`${N(p*g)}、${N(q*g)}、${N(r*g)} 的最大公因數是多少？`,
          input:'number', answers:[String(g)],
          hint:'先找兩個數的最大公因數，再和第三個數找一次。',
          review:`(${p*g}, ${q*g}, ${r*g}) 的最大公因數`
        };
      }
      const [p,q]=coprimePair(1,diff===1?6:9);
      return {
        tag:'最大公因數', subtype:'兩個數',
        html:`${N(p*g)} 和 ${N(q*g)} 的最大公因數是多少？`,
        input:'number', answers:[String(g)],
        hint:'列出兩個數的因數，找出共同因數中最大的；也可以用短除法。',
        review:`(${p*g}, ${q*g}) 的最大公因數`
      };
    }
    if(type==='lcm'){
      if(diff===3){
        let a,b,c;
        do{ a=rnd(2,12); b=rnd(2,12); c=rnd(2,12); }while(a===b||b===c||a===c);
        const l=lcm(lcm(a,b),c);
        return {
          tag:'最小公倍數', subtype:'三個數',
          html:`${N(a)}、${N(b)}、${N(c)} 的最小公倍數是多少？`,
          input:'number', answers:[String(l)],
          hint:'先找兩個數的最小公倍數，再和第三個數找一次。',
          review:`[${a}, ${b}, ${c}] 的最小公倍數`
        };
      }
      const top=diff===1?12:20;
      let a,b; do{ a=rnd(2,top); b=rnd(2,top); }while(a===b);
      return {
        tag:'最小公倍數', subtype:'兩個數',
        html:`${N(a)} 和 ${N(b)} 的最小公倍數是多少？`,
        input:'number', answers:[String(lcm(a,b))],
        hint:'列出較大數的倍數，找出第一個也是另一個數倍數的數。',
        review:`[${a}, ${b}] 的最小公倍數`
      };
    }
    if(type==='gcdApp'){
      const g=rnd(3,diff===2?9:15);
      let [p,q]=coprimePair(2,diff===2?5:7); if(p<q)[p,q]=[q,p];
      if(pick([true,false])){
        return {
          tag:'最大公因數', subtype:'裁正方形',
          html:`一張長 ${N(p*g)} 公分、寬 ${N(q*g)} 公分的長方形紙，<br>要剪成同樣大小的正方形，而且紙不能有剩，<br>正方形的邊長最長是幾公分？`,
          input:'number', answers:[String(g)], unit:'公分',
          hint:'正方形的邊長要同時是長和寬的因數，取最大的那個。',
          review:`${p*g}×${q*g} 的紙剪最大正方形`
        };
      }
      return {
        tag:'最大公因數', subtype:'平分問題',
        html:`有 ${N(p*g)} 顆蘋果和 ${N(q*g)} 顆橘子，要平分給一些小朋友，<br>每人分到的蘋果一樣多、橘子也一樣多，而且都沒有剩，<br>最多可以分給幾位小朋友？`,
        input:'number', answers:[String(g)], unit:'位',
        hint:'人數要同時能整除蘋果數和橘子數，取最大的那個。',
        review:`蘋果${p*g}、橘子${q*g} 最多分幾人`
      };
    }
    // lcmApp
    {
      if(pick([true,false])){
        const pool=diff===2?[4,6,8,10,12,15]:[6,8,9,10,12,15,18,20];
        let a,b; do{ a=pick(pool); b=pick(pool); }while(a===b);
        return {
          tag:'最小公倍數', subtype:'同時發車',
          html:`甲公車每 ${N(a)} 分鐘發一班，乙公車每 ${N(b)} 分鐘發一班，<br>早上 7:00 兩車同時發車，至少再過幾分鐘會再同時發車？`,
          input:'number', answers:[String(lcm(a,b))], unit:'分鐘',
          hint:'再同時發車的時間，必須同時是兩個數的倍數，取最小的。',
          review:`每${a}分、每${b}分 同時發車`
        };
      }
      let a,b; do{ a=rnd(2,12); b=rnd(2,12); }while(a===b);
      return {
        tag:'最小公倍數', subtype:'拼正方形',
        html:`用長 ${N(Math.max(a,b))} 公分、寬 ${N(Math.min(a,b))} 公分的長方形磁磚，<br>同方向拼成一個正方形，正方形的邊長最短是幾公分？`,
        input:'number', answers:[String(lcm(a,b))], unit:'公分',
        hint:'正方形的邊長要同時是長和寬的倍數，取最小的那個。',
        review:`${Math.max(a,b)}×${Math.min(a,b)} 磁磚拼最小正方形`
      };
    }
  },

  /* ── 6-2. 分數除法 ── */
  fracdiv(diff){
    const type = pick(diff===1
      ? ['simplest','sameDen','sameDen','diffDen']
      : ['simplest','whichSimplest','sameDen','diffDen','diffDen','apply']);
    const top = diff===1?9:12;

    if(type==='simplest'){
      let [p,q]=coprimePair(1,top); if(p>q)[p,q]=[q,p];
      const k=rnd(2,diff===1?5:diff===2?9:15);
      return {
        tag:'最簡分數', subtype:'約分',
        html:`把 ${fracHTML(p*k,q*k)} 約分成最簡分數。`,
        ...fracAns(p,q), exact:`${p}/${q}`,
        hint:'分子和分母同除以它們的最大公因數，直到不能再約。',
        review:`${p*k}/${q*k} 約成最簡分數`
      };
    }
    if(type==='whichSimplest'){
      let [p,q]=coprimePair(2,15); if(p>q)[p,q]=[q,p];
      const wrong=new Set();
      while(wrong.size<3){
        let [a,b]=coprimePair(1,7); if(a>b)[a,b]=[b,a];
        const k=rnd(2,4); wrong.add(`${a*k}/${b*k}`);
      }
      const options=shuffle([`${p}/${q}`,...wrong]);
      return {
        tag:'最簡分數', subtype:'找最簡分數',
        html:`下面哪一個是<b>最簡分數</b>？`,
        input:'choice', options, answers:[`${p}/${q}`],
        optionsHTML:options.map(s=>{const [a,b]=s.split('/');return fracHTML(a,b);}),
        hint:'分子和分母的公因數只有 1，就是最簡分數。',
        review:`${options.join('、')} 中的最簡分數`
      };
    }
    if(type==='sameDen'){
      const d=rnd(3,top);
      let a,b;
      do{ a=rnd(1,diff===1?d-1:2*d); b=rnd(1,d-1); }while(a===b||gcd(a,d)!==1||gcd(b,d)!==1);
      return {
        tag:'同分母分數除法', subtype:'同分母',
        html:`${fracHTML(a,d)} ÷ ${fracHTML(b,d)} = ？`,
        ...fracAns(a,b),
        hint:'分母相同時，直接用分子相除：a/d ÷ b/d = a ÷ b。',
        review:`${a}/${d} ÷ ${b}/${d}`
      };
    }
    if(type==='diffDen'){
      let d1,d2,n1,n2;
      do{ d1=rnd(2,top); d2=rnd(2,top); }while(d1===d2);
      do{ n2=rnd(1,diff===3?2*d2:d2-1); }while(gcd(n2,d2)!==1);
      // 普通以上偶爾出「整數 ÷ 分數」
      if(diff>1 && rnd(0,2)===0){
        const w=rnd(2,12);
        return {
          tag:'異分母分數除法', subtype:'整數÷分數',
          html:`${N(w)} ÷ ${fracHTML(n2,d2)} = ？`,
          ...fracAns(w*d2,n2),
          hint:'除以一個分數，等於乘以它的倒數。',
          review:`${w} ÷ ${n2}/${d2}`
        };
      }
      do{ n1=rnd(1,diff===3?2*d1:d1-1); }while(gcd(n1,d1)!==1);
      return {
        tag:'異分母分數除法', subtype:'異分母',
        html:`${fracHTML(n1,d1)} ÷ ${fracHTML(n2,d2)} = ？`,
        ...fracAns(n1*d2,d1*n2),
        hint:'除以一個分數，等於乘以它的倒數；也可以先通分再把分子相除。',
        review:`${n1}/${d1} ÷ ${n2}/${d2}`
      };
    }
    // apply
    {
      if(pick([true,false])){
        let n,d; do{ d=rnd(2,top); n=rnd(1,d-1); }while(gcd(n,d)!==1);
        const k=rnd(3,diff===2?12:20);
        return {
          tag:'異分母分數除法', subtype:'包含除',
          html:`一條緞帶長 ${fracDisp(k*n,d)} 公尺，每 ${fracHTML(n,d)} 公尺剪成一段，<br>可以剪成幾段？`,
          input:'number', answers:[String(k)], unit:'段',
          hint:'總長 ÷ 每段長 = 段數。',
          review:`${fracText(...simp(k*n,d))} 公尺 ÷ ${n}/${d} 公尺`
        };
      }
      let n1,d1,n2,d2;
      do{ d1=rnd(2,top); n1=rnd(1,2*d1); }while(gcd(n1,d1)!==1);
      do{ d2=rnd(2,6); n2=rnd(1,d2-1); }while(gcd(n2,d2)!==1);
      return {
        tag:'異分母分數除法', subtype:'速率',
        html:`小明 ${fracHTML(n2,d2)} 小時走了 ${fracHTML(n1,d1)} 公里，<br>平均每小時走幾公里？`,
        ...fracAns(n1*d2,d1*n2), unit:'公里',
        hint:'距離 ÷ 時間 = 每小時走的距離。',
        review:`${n1}/${d1} 公里 ÷ ${n2}/${d2} 小時`
      };
    }
  },

  /* ── 6-3. 小數除法 ── */
  decdiv(diff){
    const type = pick(diff===1
      ? ['div1','div1','div2','round']
      : ['div1','div2','round','roundApp']);

    if(type==='div1'||type==='div2'){
      const sc = type==='div1'?10:100;
      let dv; do{ dv=rnd(2,type==='div1'?(diff===1?49:99):(diff===1?99:499)); }while(dv%10===0);
      // 簡單只出整數商，其餘可能出一位小數的商
      const qs = diff===1 ? 1 : pick([1,1,10]);
      const qv = rnd(2,diff===3?99:30);
      return {
        tag: type==='div1'?'除以一位小數':'除以二位小數', subtype:'計算',
        html:`${N(trimNum(dv*qv/(sc*qs)))} ÷ ${N(trimNum(dv/sc))} = ？`,
        input:'number', answers:[trimNum(qv/qs)],
        hint:`除數和被除數的小數點同時向右移 ${sc===10?1:2} 位，變成除以整數再算。`,
        review:`${trimNum(dv*qv/(sc*qs))} ÷ ${trimNum(dv/sc)}`
      };
    }
    if(type==='round'){
      const k = diff===1 ? pick([0,1]) : pick([1,2]);
      const place = ['整數','小數第一位','小數第二位'][k];
      // 實際值 = A ÷ B；挑戰題的被除數和除數都是一位小數
      const s = Math.pow(10,k);
      let A,B;
      do{
        A = diff===3 ? rnd(100,999) : rnd(10,diff===1?99:999);
        B = diff===3 ? rnd(11,99) : rnd(3,9);
      }while((A*s*10)%B===0 || (diff===3 && B%10===0)); // 確保真的需要四捨五入
      const shown = diff===3 ? [trimNum(A/10),trimNum(B/10)] : [A,B];
      const R = Math.floor((2*A*s + B)/(2*B)); // 四捨五入（整數運算）
      return {
        tag:'除法與概數', subtype:'四捨五入',
        html:`${N(shown[0])} ÷ ${N(shown[1])} 的商，用四捨五入法取到<b>${place}</b>是多少？`,
        input:'number', answers:[trimNum(R/s)], ansLabel:(R/s).toFixed(k),
        hint:`商算到${place}的下一位，再四捨五入。`,
        review:`${shown[0]} ÷ ${shown[1]} 取到${place}`
      };
    }
    // roundApp：無條件捨去 / 無條件進入
    {
      let T,P; // 以 0.1 為單位
      do{ T=rnd(50,diff===2?200:500); P=rnd(3,diff===2?20:35); }while(P%10===0 || T%P===0 || T<P*2);
      if(pick([true,false])){
        return {
          tag:'除法與概數', subtype:'無條件捨去',
          html:`一條繩子長 ${N(trimNum(T/10))} 公尺，每 ${N(trimNum(P/10))} 公尺剪成一段，<br>最多可以剪成幾段？`,
          input:'number', answers:[String(Math.floor(T/P))], unit:'段',
          hint:'剩下不夠一段的要捨去（無條件捨去法）。',
          review:`${trimNum(T/10)} ÷ ${trimNum(P/10)} 最多幾段`
        };
      }
      return {
        tag:'除法與概數', subtype:'無條件進入',
        html:`有 ${N(trimNum(T/10))} 公升的果汁，每個瓶子最多裝 ${N(trimNum(P/10))} 公升，<br>要全部裝完，至少需要幾個瓶子？`,
        input:'number', answers:[String(Math.ceil(T/P))], unit:'個',
        hint:'剩下的果汁也要裝，所以要多用一個瓶子（無條件進入法）。',
        review:`${trimNum(T/10)} ÷ ${trimNum(P/10)} 至少幾瓶`
      };
    }
  },

  /* ── 6-4. 比和相等的比、最簡整數比、比值 ── */
  ratio6(diff){
    const type = pick(diff===1
      ? ['equal','simpleInt','value']
      : ['equal','pickEqual','simpleInt','simpleDec','simpleFrac','value']);

    if(type==='equal'){
      const [p,q]=coprimePair(1,9);
      let k1,k2; do{ k1=rnd(1,6); k2=rnd(2,diff===1?5:9); }while(k1===k2);
      const t=[p*k1,q*k1,p*k2,q*k2];
      const idx = diff===1 ? pick([2,3]) : rnd(0,3);
      const s=t.map((v,i)=>i===idx?'？':v);
      return {
        tag:'相等的比', subtype:'求未知項',
        html:`${N(`${s[0]} : ${s[1]} = ${s[2]} : ${s[3]}`)}，問號是多少？`,
        input:'number', answers:[String(t[idx])],
        hint:'前項和後項同時乘以（或除以）同一個不為 0 的數，比會相等。',
        review:`${s[0]}:${s[1]} = ${s[2]}:${s[3]}`
      };
    }
    if(type==='pickEqual'){
      const [p,q]=coprimePair(1,9);
      let k1,k2; do{ k1=rnd(2,6); k2=rnd(2,9); }while(k1===k2);
      const a=p*k1, b=q*k1, c=p*k2, d=q*k2;
      const seen=new Set([`${c} : ${d}`]), wrong=[];
      for(const [x,y] of shuffle([[c+1,d],[d,c],[p+k2,q+k2],[c,d+1],[c-1,d],[c+k2,d]])){
        const key=`${x} : ${y}`;
        if(x>0 && y>0 && x*q!==y*p && !seen.has(key)){ seen.add(key); wrong.push(key); }
        if(wrong.length===3) break;
      }
      const options=shuffle([`${c} : ${d}`,...wrong]);
      return {
        tag:'相等的比', subtype:'找相等的比',
        html:`下面哪一個比和 ${N(`${a} : ${b}`)} 相等？`,
        input:'choice', options, answers:[`${c} : ${d}`],
        hint:'把每個比化成最簡整數比，或算出比值來比較。',
        review:`和 ${a}:${b} 相等的比`
      };
    }
    if(type==='simpleInt'){
      const [p,q]=coprimePair(1,diff===1?9:12);
      const k=rnd(2,diff===1?6:diff===2?12:25);
      return {
        tag:'最簡整數比', subtype:'整數比',
        html:`把 ${N(`${p*k} : ${q*k}`)} 化成最簡整數比。`,
        input:'ratio', strictRatio:true, answers:[`${p}:${q}`], ansLabel:`${p} : ${q}`,
        hint:'前項和後項同除以它們的最大公因數。',
        review:`${p*k} : ${q*k}`
      };
    }
    if(type==='simpleDec'){
      const [p,q]=coprimePair(1,9);
      const sc = diff===3 ? pick([10,100]) : 10;
      let k; do{ k = sc===10 ? rnd(1,9) : rnd(11,99); }while((p*k)%sc===0 && (q*k)%sc===0);
      const a=trimNum(p*k/sc), b=trimNum(q*k/sc);
      return {
        tag:'最簡整數比', subtype:'小數比',
        html:`把 ${N(`${a} : ${b}`)} 化成最簡整數比。`,
        input:'ratio', strictRatio:true, answers:[`${p}:${q}`], ansLabel:`${p} : ${q}`,
        hint:`前項和後項同乘 ${sc} 變成整數比，再化簡。`,
        review:`${a} : ${b}`
      };
    }
    if(type==='simpleFrac'){
      let n1,d1,n2,d2,x,y;
      do{
        d1=rnd(2,9); n1=rnd(1,d1-1); d2=rnd(2,9); n2=rnd(1,d2-1);
        [x,y]=simp(n1*d2,n2*d1);
      }while(gcd(n1,d1)!==1 || gcd(n2,d2)!==1 || x===y);
      return {
        tag:'最簡整數比', subtype:'分數比',
        html:`把 ${fracHTML(n1,d1)} : ${fracHTML(n2,d2)} 化成最簡整數比。`,
        input:'ratio', strictRatio:true, answers:[`${x}:${y}`], ansLabel:`${x} : ${y}`,
        hint:'前項和後項同乘兩個分母的最小公倍數，變成整數比再化簡。',
        review:`${n1}/${d1} : ${n2}/${d2}`
      };
    }
    // value：比值
    {
      const [p,q]=coprimePair(1,diff===1?9:12);
      const k=rnd(2,diff===1?5:9);
      return {
        tag:'比值', subtype:'求比值',
        html:`${N(`${p*k} : ${q*k}`)} 的比值是多少？`,
        ...fracAns(p,q),
        hint:'比值 = 前項 ÷ 後項，可以寫成分數。',
        review:`${p*k} : ${q*k} 的比值`
      };
    }
  },

  /* ── 6-5. 兩量關係 ── */
  twoqty(diff){
    const type = pick(diff===1
      ? ['concept','compare','findBase','times']
      : ['compare','findBase','times','sum','sum','diff','diff']);
    const [p,q]=coprimePair(1,diff===1?5:diff===2?9:12);
    const k=rnd(2,diff===1?6:diff===3?15:10);
    const rH = q===1 ? N(p) : fracHTML(p,q);
    const rT = q===1 ? `${p}` : `${p}/${q}`;

    if(type==='concept'){
      const sc=pick([
        {s:'弟弟的身高是哥哥的幾倍？', cmp:'弟弟', base:'哥哥'},
        {s:'媽媽的年齡是小明的 4 倍。', cmp:'媽媽', base:'小明'},
        {s:'蘋果的數量是橘子的 2/3 倍。', cmp:'蘋果', base:'橘子'},
        {s:'鉛筆的價錢是原子筆的 0.6 倍。', cmp:'鉛筆', base:'原子筆'},
        {s:'貓的體重是狗的幾分之幾？', cmp:'貓', base:'狗'}
      ]);
      const ask=pick(['基準量','比較量']);
      return {
        tag:'基準量與比較量', subtype:'認識',
        html:`「${sc.s}」<br>這句話中，<b>${ask}</b>是誰？`,
        input:'choice', options:shuffle([sc.cmp,sc.base]), answers:[ask==='基準量'?sc.base:sc.cmp],
        hint:'「A 是 B 的幾倍」：B 是拿來比的標準（基準量），A 是被比的（比較量）。',
        review:`「${sc.s}」的${ask}`
      };
    }
    if(type==='compare'){
      return {
        tag:'基準量與比較量', subtype:'求比較量',
        html:`姊姊有 ${N(q*k)} 元，妹妹的錢是姊姊的 ${rH} 倍，<br>妹妹有幾元？`,
        input:'number', answers:[String(p*k)], unit:'元',
        hint:'比較量 = 基準量 × 倍數。',
        review:`姊姊${q*k}元，妹妹是 ${rT} 倍`
      };
    }
    if(type==='findBase'){
      return {
        tag:'基準量與比較量', subtype:'求基準量',
        html:`紅繩長 ${N(p*k)} 公分，是藍繩的 ${rH} 倍，<br>藍繩長幾公分？`,
        input:'number', answers:[String(q*k)], unit:'公分',
        hint:'基準量 = 比較量 ÷ 倍數。',
        review:`紅繩${p*k}公分是藍繩的 ${rT} 倍`
      };
    }
    if(type==='times'){
      return {
        tag:'基準量與比較量', subtype:'求倍數',
        html:`哥哥有 ${N(q*k)} 張卡片，弟弟有 ${N(p*k)} 張，<br>弟弟的卡片是哥哥的幾倍？`,
        ...fracAns(p,q),
        hint:'倍數 = 比較量 ÷ 基準量；「是哥哥的」→ 哥哥是基準量。',
        review:`弟弟${p*k}張是哥哥${q*k}張的幾倍`
      };
    }
    if(type==='sum'){
      const askBase=pick([true,false]);
      return {
        tag:'兩量和問題', subtype:askBase?'求基準量':'求比較量',
        html:`紅繩長度是藍繩的 ${rH} 倍，兩條繩子共長 ${N((p+q)*k)} 公分，<br>${askBase?'藍':'紅'}繩長幾公分？`,
        input:'number', answers:[String(askBase?q*k:p*k)], unit:'公分',
        hint:`把藍繩當作 1，兩條合起來是 (1 + ${rT}) 倍，藍繩 = 總長 ÷ (1 + ${rT})。`,
        review:`紅是藍的 ${rT} 倍，共 ${(p+q)*k}，求${askBase?'藍':'紅'}`
      };
    }
    // diff：兩量差
    {
      const askBase=pick([true,false]);
      const more=p>q;
      return {
        tag:'兩量差問題', subtype:askBase?'求基準量':'求比較量',
        html:`今年果園的收成是去年的 ${rH} 倍，比去年${more?'多':'少'} ${N(Math.abs(p-q)*k)} 公斤，<br>${askBase?'去年':'今年'}收成多少公斤？`,
        input:'number', answers:[String(askBase?q*k:p*k)], unit:'公斤',
        hint:`把去年當作 1，兩年相差 ${more?`(${rT} − 1)`:`(1 − ${rT})`} 倍，就是 ${Math.abs(p-q)*k} 公斤。`,
        review:`今年是去年的 ${rT} 倍，${more?'多':'少'} ${Math.abs(p-q)*k}，求${askBase?'去年':'今年'}`
      };
    }
  },

  /* ── 6-6. 圓周長與扇形周長（圓周率 3.14） ── */
  circle(diff){
    const type = pick(diff===1
      ? ['pi','circ','circ','arc']
      : ['pi','circ','arc','sector','sector','apply','apply']);
    // 長度都先用「× 100」的整數算，避免浮點誤差
    const cm = h=>trimNum(h/100);

    if(type==='pi'){
      if(diff===1 && pick([true,false])){
        const c=pick([
          {q:'圓周率是「圓周長」除以什麼得到的？', o:['直徑','半徑','圓心','面積'], a:'直徑'},
          {q:'不論圓的大小，圓周長大約是直徑的幾倍？', o:['2 倍','3.14 倍','6.28 倍','4 倍'], a:'3.14 倍'},
          {q:'圓周長大約是半徑的幾倍？', o:['3.14 倍','6.28 倍','2 倍','1.57 倍'], a:'6.28 倍'}
        ]);
        return {
          tag:'圓周率', subtype:'認識圓周率',
          html:c.q, input:'choice', options:c.o, answers:[c.a],
          hint:'圓周率 = 圓周長 ÷ 直徑 ≈ 3.14；直徑是半徑的 2 倍。',
          review:c.q
        };
      }
      const d=rnd(1,diff===1?20:30)*(diff===1?1:2);
      const askR = diff>1 && pick([true,false]);
      return {
        tag:'圓周率', subtype:askR?'求半徑':'求直徑',
        html:`一個圓的圓周長是 ${N(cm(314*d))} 公分，${askR?'半徑':'直徑'}是幾公分？（圓周率用 3.14）`,
        visual:circleSVG(`圓周長 ${cm(314*d)} 公分`, askR),
        input:'number', answers:[String(askR?d/2:d)], unit:'公分',
        hint:askR?'直徑 = 圓周長 ÷ 3.14，半徑 = 直徑 ÷ 2。':'直徑 = 圓周長 ÷ 3.14。',
        review:`圓周長 ${cm(314*d)} 求${askR?'半徑':'直徑'}`
      };
    }
    if(type==='circ'){
      if(diff===3){
        let d10; do{ d10=rnd(11,199); }while(d10%10===0);
        return {
          tag:'圓周長', subtype:'小數直徑',
          html:`直徑 ${N(trimNum(d10/10))} 公分的圓，圓周長是幾公分？（圓周率用 3.14）`,
          visual:circleSVG(`直徑 ${trimNum(d10/10)} 公分`, false),
          input:'number', answers:[trimNum(d10*314/1000)], unit:'公分',
          hint:'圓周長 = 直徑 × 3.14。',
          review:`直徑 ${trimNum(d10/10)} 的圓周長`
        };
      }
      const useR = diff===2 && pick([true,false]);
      const v=rnd(1,diff===1?20:30);
      return {
        tag:'圓周長', subtype:useR?'已知半徑':'已知直徑',
        html:`${useR?'半徑':'直徑'} ${N(v)} 公分的圓，圓周長是幾公分？（圓周率用 3.14）`,
        visual:circleSVG(`${useR?'半徑':'直徑'} ${v} 公分`, useR),
        input:'number', answers:[cm(314*v*(useR?2:1))], unit:'公分',
        hint:useR?'圓周長 = 半徑 × 2 × 3.14。':'圓周長 = 直徑 × 3.14。',
        review:`${useR?'半徑':'直徑'} ${v} 的圓周長`
      };
    }
    if(type==='arc'||type==='sector'){
      const degs = diff===1?[180,90]:diff===2?[180,90,270,60,120]:[45,30,60,120,135,150,270];
      const deg=pick(degs);
      let r; do{ r=rnd(2,diff===1?10:20); }while((r*deg)%90!==0); // 讓弧長剛好到小數第二位
      const arcH=628*r*deg/360;
      const isArc = type==='arc';
      return {
        tag:'扇形弧長與周長', subtype:isArc?'弧長':'扇形周長',
        html:`半徑 ${N(r)} 公分、圓心角 ${N(deg+'°')} 的扇形，${isArc?'<b>弧長</b>':'<b>周長</b>'}是幾公分？（圓周率用 3.14）`,
        visual:sectorSVG(deg,r),
        input:'number', answers:[cm(isArc?arcH:arcH+200*r)], unit:'公分',
        hint:isArc?'弧長 = 半徑 × 2 × 3.14 × 圓心角/360。':'扇形周長 = 弧長 + 2 條半徑，別忘了兩條半徑！',
        review:`半徑${r}、${deg}° 扇形的${isArc?'弧長':'周長'}`
      };
    }
    // apply
    {
      const kinds = diff===2 ? ['wheel','semi','reverse'] : ['wheel','semi','track','split'];
      const kind=pick(kinds);
      if(kind==='wheel'){
        const d=rnd(3,8)*10, n=rnd(2,diff===2?10:25);
        return {
          tag:'圓周長的應用', subtype:'滾動距離',
          html:`腳踏車輪子的直徑是 ${N(d)} 公分，輪子滾動 ${N(n)} 圈，<br>腳踏車前進了幾公分？（圓周率用 3.14）`,
          input:'number', answers:[cm(314*d*n)], unit:'公分',
          hint:'輪子滾一圈前進的距離 = 輪子的圓周長。',
          review:`直徑${d} 輪子滾${n}圈`
        };
      }
      if(kind==='semi'){
        const d=rnd(2,diff===2?20:40)*2;
        return {
          tag:'圓周長的應用', subtype:'半圓周長',
          html:`一個半圓形花圃的直徑是 ${N(d)} 公尺，<br>沿著花圃外圍（含直徑那一邊）圍一圈籬笆，籬笆長幾公尺？（圓周率用 3.14）`,
          input:'number', answers:[cm(157*d+100*d)], unit:'公尺',
          hint:'半圓周長 = 直徑 × 3.14 ÷ 2，再加上直徑。',
          review:`直徑${d} 的半圓周長`
        };
      }
      if(kind==='reverse'){
        const r=rnd(2,25);
        return {
          tag:'圓周長的應用', subtype:'由周長求半徑',
          html:`一個圓形水池的周長是 ${N(cm(628*r))} 公尺，<br>水池的半徑是幾公尺？（圓周率用 3.14）`,
          input:'number', answers:[String(r)], unit:'公尺',
          hint:'半徑 = 圓周長 ÷ 3.14 ÷ 2。',
          review:`周長 ${cm(628*r)} 求半徑`
        };
      }
      if(kind==='track'){
        const L=rnd(5,12)*10, D=rnd(3,8)*10;
        return {
          tag:'圓周長的應用', subtype:'操場跑道',
          html:`操場跑道由兩條長 ${N(L)} 公尺的直線，和兩端各一個直徑 ${N(D)} 公尺的半圓組成，<br>跑一圈是幾公尺？（圓周率用 3.14）`,
          input:'number', answers:[cm(200*L+314*D)], unit:'公尺',
          hint:'兩個半圓合起來是一個完整的圓，再加上兩條直線。',
          review:`直線${L}×2 + 直徑${D} 的圓`
        };
      }
      // split：圓平分成扇形
      const n=pick([2,3,4,6]);
      let r; do{ r=rnd(2,20); }while(n%3===0 && r%3!==0);
      return {
        tag:'圓周長的應用', subtype:'平分扇形',
        html:`把一個半徑 ${N(r)} 公分的圓形紙片平分成 ${N(n)} 個相同的扇形，<br>每個扇形的周長是幾公分？（圓周率用 3.14）`,
        input:'number', answers:[cm(628*r/n+200*r)], unit:'公分',
        hint:'每個扇形的弧長 = 圓周長 ÷ 份數，再加上 2 條半徑。',
        review:`半徑${r} 的圓平分 ${n} 份，扇形周長`
      };
    }
  },

  /* ── 6-7. 怎樣解題 ── */
  solve(diff){
    const type = pick(['interval','pattern','combo','sumdiff']);

    if(type==='interval'){
      const kind = pick(diff===1 ? ['both','none','circle'] : ['both','none','circle','saw','stairs']);
      const g=pick([2,3,4,5,6,8,10]), n=rnd(diff===1?3:5,diff===3?40:20), L=g*n;
      if(kind==='saw'){
        const m=rnd(3,12), t=rnd(2,9);
        return {
          tag:'間隔問題', subtype:'鋸木頭',
          html:`把一根木頭鋸成 ${N(m)} 段，每鋸一次要 ${N(t)} 分鐘，<br>一共要鋸幾分鐘？`,
          input:'number', answers:[String((m-1)*t)], unit:'分鐘',
          hint:'鋸成 m 段，只要鋸 (m − 1) 次。',
          review:`鋸成${m}段，每次${t}分`
        };
      }
      if(kind==='stairs'){
        const s=rnd(10,30), m=rnd(4,9);
        return {
          tag:'間隔問題', subtype:'爬樓梯',
          html:`小明從 1 樓走到 3 樓要 ${N(2*s)} 秒，照這樣的速度，<br>從 1 樓走到 ${N(m)} 樓要幾秒？`,
          input:'number', answers:[String(s*(m-1))], unit:'秒',
          hint:'1 樓到 3 樓只爬了 2 層樓梯，先算爬一層要幾秒。',
          review:`1→3 樓 ${2*s} 秒，1→${m} 樓`
        };
      }
      const sc={
        both:  {html:`一條長 ${N(L)} 公尺的步道，一側每隔 ${N(g)} 公尺種一棵樹，<br>頭尾兩端都要種，一共要種幾棵樹？`, ans:n+1, unit:'棵', hint:'兩端都種：棵數 = 間隔數 + 1。', sub:'兩端都種'},
        none:  {html:`一條長 ${N(L)} 公尺的步道，一側每隔 ${N(g)} 公尺種一棵樹，<br>頭尾兩端都不種，一共要種幾棵樹？`, ans:n-1, unit:'棵', hint:'兩端都不種：棵數 = 間隔數 − 1。', sub:'兩端不種'},
        circle:{html:`圓形池塘的周長是 ${N(L)} 公尺，沿著池邊每隔 ${N(g)} 公尺放一盞燈，<br>一共要放幾盞燈？`, ans:n, unit:'盞', hint:'圍成一圈：盞數 = 間隔數。', sub:'圍成一圈'}
      }[kind];
      return {
        tag:'間隔問題', subtype:sc.sub,
        html:sc.html, input:'number', answers:[String(sc.ans)], unit:sc.unit,
        hint:`先算有幾個間隔（${L} ÷ ${g}）。${sc.hint}`,
        review:`${L} 公尺每隔 ${g} 公尺（${sc.sub}）`
      };
    }
    if(type==='pattern'){
      const kind = pick(diff===3 ? ['seq','square','triangle','table','corner'] : ['seq','square','triangle','table']);
      const n=rnd(diff===1?5:8, diff===1?10:diff===2?20:50);
      if(kind==='seq'){
        const a=rnd(1,10), d=rnd(2,diff===3?12:6);
        return {
          tag:'數形規律', subtype:'數列',
          html:`${N(`${a}、${a+d}、${a+2*d}、${a+3*d}、……`)}<br>照這個規律，第 ${N(n)} 個數是多少？`,
          input:'number', answers:[String(a+(n-1)*d)],
          hint:`每次增加 ${d}，第 n 個數 = 第 1 個數 + (n − 1) × ${d}。`,
          review:`${a}, ${a+d}, ${a+2*d}… 第 ${n} 個`
        };
      }
      if(kind==='corner'){
        return {
          tag:'數形規律', subtype:'正方形排棋子',
          html:`把棋子排成一個正方形，每一邊都有 ${N(n)} 顆（四個角都有放），<br>一共用了幾顆棋子？`,
          input:'number', answers:[String(4*(n-1))], unit:'顆',
          hint:'角上的棋子被兩邊共用，總數 = 4 × (每邊個數 − 1)。',
          review:`正方形每邊 ${n} 顆棋子`
        };
      }
      const sc={
        square:  {html:'用火柴棒排正方形（排成一排），1 個要 4 根，2 個要 7 根，3 個要 10 根……', q:`排 ${N(n)} 個正方形要幾根火柴？`, ans:3*n+1, unit:'根', hint:'第 1 個用 4 根，之後每多 1 個正方形只多 3 根。', sub:'火柴正方形'},
        triangle:{html:'用火柴棒排三角形（排成一排），1 個要 3 根，2 個要 5 根，3 個要 7 根……', q:`排 ${N(n)} 個三角形要幾根火柴？`, ans:2*n+1, unit:'根', hint:'第 1 個用 3 根，之後每多 1 個三角形只多 2 根。', sub:'火柴三角形'},
        table:   {html:'1 張方桌可以坐 4 人，2 張併成一排可以坐 6 人，3 張併成一排可以坐 8 人……', q:`${N(n)} 張方桌併成一排，可以坐幾人？`, ans:2*n+2, unit:'人', hint:'每多 1 張桌子，就多 2 個位子。', sub:'併桌子'}
      }[kind];
      return {
        tag:'數形規律', subtype:sc.sub,
        html:`${sc.html}<br>${sc.q}`, input:'number', answers:[String(sc.ans)], unit:sc.unit,
        hint:sc.hint, review:`${sc.sub}：第 ${n} 個`
      };
    }
    if(type==='combo'){
      const kind = pick(diff===1 ? ['clothes','handshake','order'] : ['clothes','handshake','order','cards','officers']);
      if(kind==='clothes'){
        const a=rnd(2,5), b=rnd(2,5), c=diff===3?rnd(2,3):1;
        return {
          tag:'選擇與組合', subtype:'搭配',
          html:`小美有 ${N(a)} 件上衣、${N(b)} 件裙子${c>1?`、${N(c)} 雙鞋子`:''}，<br>每次各選一樣來搭配，一共有幾種穿法？`,
          input:'number', answers:[String(a*b*c)], unit:'種',
          hint:'每件上衣都可以配每件裙子，用乘法算。',
          review:`${a}上衣 × ${b}裙子${c>1?` × ${c}鞋`:''}`
        };
      }
      if(kind==='handshake'){
        const n=rnd(3,diff===1?6:12);
        return {
          tag:'選擇與組合', subtype:'握手',
          html:`${N(n)} 位同學見面，每兩人都要握一次手，<br>一共握了幾次手？`,
          input:'number', answers:[String(n*(n-1)/2)], unit:'次',
          hint:'每人要和另外 (n − 1) 人握手，但每次握手被兩人各算一次，所以要 ÷ 2。',
          review:`${n} 人兩兩握手`
        };
      }
      if(kind==='order'){
        const n=diff===1?3:pick([3,4,5]);
        const f=[1,1,2,6,24,120][n];
        return {
          tag:'選擇與組合', subtype:'排列',
          html:`${N(n)} 位同學排成一排照相，一共有幾種不同的排法？`,
          input:'number', answers:[String(f)], unit:'種',
          hint:'第 1 個位置有 n 種選法，第 2 個位置剩 (n − 1) 種……依序相乘。',
          review:`${n} 人排一排`
        };
      }
      if(kind==='cards'){
        const k=rnd(3,5);
        const withZero = diff===3 && pick([true,false]);
        const digits = shuffle([1,2,3,4,5,6,7,8,9]).slice(0,withZero?k-1:k);
        if(withZero) digits.push(0);
        digits.sort((a,b)=>a-b);
        return {
          tag:'選擇與組合', subtype:'數字卡',
          html:`用 ${N(digits.join('、'))} 這 ${k} 張數字卡，選 2 張排成二位數，<br>可以排出幾個不同的二位數？`,
          input:'number', answers:[String(withZero?(k-1)*(k-1):k*(k-1))], unit:'個',
          hint:withZero?'十位不能是 0，所以十位有 (張數 − 1) 種選法。':'十位有 k 種選法，個位剩下 (k − 1) 種。',
          review:`數字卡 ${digits.join(',')} 排二位數`
        };
      }
      const n=rnd(4,10);
      return {
        tag:'選擇與組合', subtype:'選幹部',
        html:`從 ${N(n)} 位候選人中，選出班長和副班長各一人，<br>一共有幾種選法？`,
        input:'number', answers:[String(n*(n-1))], unit:'種',
        hint:'班長有 n 種選法，副班長剩下 (n − 1) 種；兩個職位不同，順序有差。',
        review:`${n} 人選班長、副班長`
      };
    }
    // sumdiff：和差問題
    {
      const small=rnd(5,diff===1?40:diff===2?150:500), D=rnd(2,diff===1?20:80), big=small+D, S=big+small;
      const kind = pick(diff===1 ? ['numbers','money'] : ['numbers','money','rect']);
      if(kind==='rect'){
        return {
          tag:'和差問題', subtype:'長方形',
          html:`一個長方形的周長是 ${N(2*S)} 公分，長比寬多 ${N(D)} 公分，<br>長是幾公分？`,
          input:'number', answers:[String(big)], unit:'公分',
          hint:'長 + 寬 = 周長 ÷ 2；長 = (和 + 差) ÷ 2。',
          review:`周長${2*S}，長比寬多${D}`
        };
      }
      const askBig=pick([true,false]);
      if(kind==='money'){
        return {
          tag:'和差問題', subtype:'分錢',
          html:`哥哥和弟弟共有 ${N(S)} 元，哥哥比弟弟多 ${N(D)} 元，<br>${askBig?'哥哥':'弟弟'}有幾元？`,
          input:'number', answers:[String(askBig?big:small)], unit:'元',
          hint:'大的 = (和 + 差) ÷ 2；小的 = (和 − 差) ÷ 2。',
          review:`和${S}、差${D}，求${askBig?'哥哥':'弟弟'}`
        };
      }
      return {
        tag:'和差問題', subtype:'兩數和差',
        html:`兩個數的和是 ${N(S)}，差是 ${N(D)}，<br>${askBig?'較大':'較小'}的數是多少？`,
        input:'number', answers:[String(askBig?big:small)],
        hint:'大數 = (和 + 差) ÷ 2；小數 = (和 − 差) ÷ 2。',
        review:`和${S}、差${D}，求${askBig?'大數':'小數'}`
      };
    }
  }
};

let state = { grade:5, topic:'decimal', diff:2, count:10, questions:[], answers:[], idx:0 };

function startPractice(){
  state.questions=[]; state.answers=[]; state.idx=0;
  for(let i=0;i<state.count;i++){
    state.questions.push(GEN[state.topic](state.diff));
    state.answers.push(null);
  }
  show('practice');
  document.getElementById('qtotal').textContent=state.count;
  renderQ();
}

function renderQ({ clearIfFresh=false }={}){
  const q=state.questions[state.idx];
  // 前進到從未作答的題目時清空；後退永遠顯示已儲存的答案
  const saved = (clearIfFresh && state.answers[state.idx]===null)
    ? null
    : state.answers[state.idx];
  document.getElementById('qnow').textContent=state.idx+1;
  document.getElementById('pfill').style.width=((state.idx+1)/state.count*100)+'%';
  document.getElementById('ptopic').textContent=q.tag;
  document.getElementById('qtag').textContent=q.tag;
  document.getElementById('qtext').innerHTML=q.html;
  document.getElementById('qvisual').innerHTML=q.visual||'';
  document.getElementById('qhint').textContent=q.hint||'';

  const area=document.getElementById('answer-area');
  if(q.input==='time'){
    area.innerHTML=`<span class="lab">答案</span>
      <span class="timegroup">
        <input class="field small" id="ans-h" inputmode="numeric" value="${saved?saved.h:''}"> <span class="unit">時</span>
        <input class="field small" id="ans-m" inputmode="numeric" value="${saved?saved.m:''}"> <span class="unit">分</span>
      </span>`;
  } else if(q.input==='choice'){
    area.innerHTML=`<span class="lab">答案</span>
      <div class="opts">${q.options.map((o,i)=>
        `<button class="chip opt${saved===o?' on':''}" data-v="${o}">${q.optionsHTML?q.optionsHTML[i]:o}</button>`).join('')}</div>`;
    area.querySelectorAll('.opt').forEach(b=>b.onclick=()=>
      area.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b)));
  } else {
    const ph = q.input==='fraction' ? '例：3/4' : q.input==='ratio' ? '例：2:3' : '';
    area.innerHTML=`<span class="lab">答案</span>
      <input class="field" id="ans-main" inputmode="${q.input==='number'?'decimal':'text'}" placeholder="${ph}" value="${saved!=null?saved:''}">
      ${q.unit?`<span class="unit">${q.unit}</span>`:''}`;
  }
  // nav 狀態
  document.getElementById('prev-btn').disabled = state.idx===0;
  const isLast = state.idx===state.count-1;
  const nb=document.getElementById('next-btn');
  nb.textContent = isLast ? '完成，對答案 ✓' : '下一題 →';
  // Enter 快速下一題
  const main=document.getElementById('ans-main');
  if(main){ main.focus(); main.onkeydown=e=>{if(e.key==='Enter')nextQ();}; }
}

function saveCurrent(){
  const q=state.questions[state.idx];
  if(q.input==='time'){
    const h=document.getElementById('ans-h').value.trim();
    const m=document.getElementById('ans-m').value.trim();
    state.answers[state.idx]=(h===''&&m==='')?null:{h,m};
  } else if(q.input==='choice'){
    const sel=document.querySelector('#answer-area .opt.on');
    state.answers[state.idx]= sel?sel.dataset.v:null;
  } else {
    const v=document.getElementById('ans-main').value.trim();
    state.answers[state.idx]= v===''?null:v;
  }
}

function nextQ(){
  saveCurrent();
  if(state.idx===state.count-1){ finish(); return; }
  state.idx++;
  renderQ({ clearIfFresh: true });
}
function prevQ(){ saveCurrent(); if(state.idx>0){state.idx--;renderQ();} }
